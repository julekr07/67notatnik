<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <script src="global.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#000; color:#fff; }
    #chatBox { height:400px; overflow-y:auto; border:1px solid #ff9800; padding:10px; }
    .msg { margin:5px 0; }
    .user { color:#ff9800; font-weight:bold; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-warning">Chat</h1>
    <div id="chatBox"></div>
    <div class="input-group mt-3">
      <input id="messageInput" class="form-control" placeholder="Napisz wiadomość...">
      <button id="sendBtn" class="btn btn-warning">Wyślij</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    async function loadMessages() {
      const data = await apiLoadMessages();
      chatBox.innerHTML = "";
      data.forEach(msg => {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<span class="user">${msg.login}:</span> ${msg.content}`;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      await apiSendMessage(message);
      input.value = "";
      loadMessages();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

    // Auto-refresh co 3 sekundy
    setInterval(loadMessages, 3000);
    loadMessages();
  </script>
</body>
</html>
