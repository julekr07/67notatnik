<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Tablica nauczyciela</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; }
    .bg-secondary { background-color: #111 !important; }
    .border-warning { border-color: #ff9800 !important; }
    .text-warning { color: #ff9800 !important; }
    .btn-warning { background-color: #ff9800 !important; border-color: #ff9800 !important; color: #000 !important; }
    .form-control { background-color: #000 !important; border-color: #ff9800 !important; color: #fff !important; }

    .sidebar {
      min-height: 100vh;
      background-color: #111;
      border-right: 1px solid #ff9800;
      padding: 20px;
    }
    .sidebar a {
      display: block;
      color: #ff9800;
      text-decoration: none;
      margin: 10px 0;
      font-weight: bold;
    }
    .sidebar a:hover {
      color: #fff;
    }

    #usernameDisplay {
      font-size: 16px;
      color: #0f0;
      margin-bottom: 10px;
    }
    .sidebar a {
  display: block;
  color: #00bfff; /* jasny niebieski */
  text-decoration: none;
  margin: 10px 0;
  font-weight: bold;
}

.sidebar a:hover {
  color: #fff; /* biały po najechaniu */
}

  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Lewa kolumna z odnośnikami -->
     <div class="col-md-2 sidebar" id="sidebar">
  <h4 class="text-warning">Menu</h4>
  <a href="login.html" id="logoutLink">Logowanie</a>
  <a href="tablica.html">Tablica</a>
  <a href="notatki.html">Notatki</a>
  <a href="chat.html">Chat</a>
  <a href="addusers.html">Dodaj użytkownika</a>
</div>


      <!-- Prawa kolumna z tablicą -->
      <div class="col-md-10 py-4">
        <h1 class="text-warning mb-2">Tablica nauczyciela</h1>
        <!-- Nazwa użytkownika -->
        <div id="usernameDisplay"></div>

        <div id="status" class="mb-3"></div>

        <!-- Formularz edycji tablicy (tylko dla nauczyciela) -->
        <div id="boardEditor" class="mb-3" style="display:none;">
          <textarea id="boardInput" class="form-control border-warning" rows="4" placeholder="Treść tablicy..."></textarea>
          <button id="saveBoardBtn" class="btn btn-warning mt-2">Zapisz tablicę</button>
        </div>

        <!-- Wyświetlanie tablicy -->
        <h3 class="text-warning mt-5">Aktualna treść tablicy:</h3>
        <div id="boardContent" class="p-3 border border-warning rounded bg-secondary"></div>
      </div>
    </div>
  </div>

  <script src="global.js"></script>
  <script>
    const statusBox = document.getElementById("status");
    const boardContent = document.getElementById("boardContent");
    const boardInput = document.getElementById("boardInput");
    const saveBoardBtn = document.getElementById("saveBoardBtn");
    const boardEditor = document.getElementById("boardEditor");
    const usernameDisplay = document.getElementById("usernameDisplay");

    // Wyświetlenie nazwy zalogowanego użytkownika
    const username = localStorage.getItem("username") || "Nieznany użytkownik";
    usernameDisplay.textContent = "Zalogowany jako: " + username;

    async function loadBoard() {
      const token = localStorage.getItem("token");
      const res = await fetch("http://10.103.8.116/67notatnik/api.php/board", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ read: true })
      });
      const data = await res.json();
      boardContent.textContent = data.content || "(Tablica jest pusta)";
    }

    async function saveBoard() {
      const token = localStorage.getItem("token");
      const text = boardInput.value.trim();
      if (!text) return;
      const res = await fetch("http://10.103.8.116/67notatnik/api.php/board", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ content: text })
      });
      const data = await res.json();
      if (data.success) {
        statusBox.innerHTML = `<div class="alert alert-success">Tablica zaktualizowana!</div>`;
        loadBoard();
      } else {
        statusBox.innerHTML = `<div class="alert alert-danger">${data.error || "Błąd zapisu tablicy"}</div>`;
      }
    }

    saveBoardBtn.addEventListener("click", saveBoard);

    document.getElementById("logoutLink").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("userid");
      localStorage.removeItem("username");
      localStorage.removeItem("isTeacher");
    });

    // Pokazuj edytor tylko dla nauczyciela
    if (localStorage.getItem("isTeacher") == 1) {
      boardEditor.style.display = "block";
    }

    loadBoard();
  </script>
</body>
</html>
