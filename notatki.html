<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Notatnik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; }
    .bg-secondary { background-color: #111 !important; }
    .border-warning { border-color: #ff9800 !important; }
    .text-warning { color: #ff9800 !important; }
    .btn-warning { background-color: #ff9800 !important; border-color: #ff9800 !important; color: #000 !important; }
    .btn-danger { background-color: #dc3545 !important; border-color: #dc3545 !important; color: #fff !important; }
    .form-control { background-color: #000 !important; border-color: #ff9800 !important; color: #fff !important; }
    .list-group-item { background-color: #000; border-color: #ff9800; color: #fff; }

    /* animacja rozwijania */
    .note-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .note-details.open {
      max-height: 500px;
      opacity: 1;
    }
  </style>
</head>
<body class="container-fluid py-5">
  <div class="row">
    <div class="col-12 col-md-3">
      <div class="p-3 bg-secondary border border-warning rounded">
        <h3 class="mb-3">Linki</h3>
        <ul class="list-unstyled">
          <li class="mb-2"><a href="login.html" class="text-warning text-decoration-none" id="logoutLink">Wyloguj się</a></li>
          <li class="mb-2"><a href="tablica.html" class="text-warning text-decoration-none">Tablica</a></li>
          <li><a href="notatki.html" class="text-warning text-decoration-none">Notatki</a></li>
        </ul>
      </div>
    </div>

    <div class="col-12 col-md-9">
      <h1 class="text-warning mb-4">📝 Mój Notatnik</h1>   
      <div id="status" class="mb-3"></div>

      <!-- Formularz dodawania notatki -->
      <div class="mb-3">
        <input id="noteTitle" class="form-control border-warning mb-2" placeholder="Temat notatki (opcjonalny)">
        <textarea id="noteInput" class="form-control border-warning" rows="3" placeholder="Treść notatki..."></textarea>
      </div>
      <button id="addNoteBtn" class="btn btn-warning">Dodaj notatkę</button>

      <!-- Lista notatek -->
      <h3 class="text-warning mt-5">Twoje notatki:</h3>
      <ul id="notesList" class="list-group mt-3"></ul>
    </div>
  </div>

  <script src="global.js"></script>
  <script>
    const statusBox = document.getElementById("status");
    const notesList = document.getElementById("notesList");
    const noteInput = document.getElementById("noteInput");
    const noteTitle = document.getElementById("noteTitle");
    const addNoteBtn = document.getElementById("addNoteBtn");

    let notes = [];

    function parseNoteContent(content) {
      try {
        const obj = JSON.parse(content);
        return { title: obj.title || "", text: obj.text || "" };
      } catch (_) {
        return { title: "", text: content || "" };
      }
    }

    function displayTitleOrPreview(noteObj) {
      if (noteObj.title.trim()) return noteObj.title;
      return noteObj.text.split(/\s+/).slice(0, 3).join(" ");
    }

    function renderNotes() {
      notesList.innerHTML = "";
      notes.forEach((note, index) => {
        const { title, text } = parseNoteContent(note.content);

        const li = document.createElement("li");
        li.className = "list-group-item border-warning";

        const header = document.createElement("div");
        header.className = "d-flex justify-content-between align-items-center";
        header.style.cursor = "pointer";

        const textSpan = document.createElement("span");
        textSpan.textContent = displayTitleOrPreview({ title, text });

        const btnGroup = document.createElement("div");

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn btn-sm btn-danger";
        deleteBtn.textContent = "🗑️ Usuń";
        deleteBtn.onclick = async (e) => {
          e.stopPropagation();
          const resp = await apiDeleteNote(note.id);
          if (resp && resp.success) {
            notes.splice(index, 1);
            renderNotes();
          } else {
            const msg = resp && resp.error ? resp.error : "Nie udało się usunąć notatki";
            statusBox.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
          }
        };

        btnGroup.appendChild(deleteBtn);
        header.appendChild(textSpan);
        header.appendChild(btnGroup);

        const details = document.createElement("div");
        details.className = "note-details mt-2";

        const titleInput = document.createElement("input");
        titleInput.className = "form-control border-warning mb-2";
        titleInput.value = title;

        const textArea = document.createElement("textarea");
        textArea.className = "form-control border-warning mb-2";
        textArea.rows = 3;
        textArea.value = text;

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn btn-sm btn-warning";
        saveBtn.textContent = "💾 Zapisz";
        saveBtn.onclick = async (e) => {
          e.stopPropagation();
          const newTitle = titleInput.value.trim();
          const newText = textArea.value.trim();
          if (!newText) return;

          const data = await apiAddNote(newTitle, newText);
          if (data && data.success) {
            notes[index].content = JSON.stringify({ title: newTitle, text: newText });
            renderNotes();
          }
        };

        details.appendChild(titleInput);
        details.appendChild(textArea);
        details.appendChild(saveBtn);

        header.onclick = () => {
          details.classList.toggle("open");
        };

        li.appendChild(header);
        li.appendChild(details);
        notesList.appendChild(li);
      });
    }

    async function loadNotes() {
      const data = await apiLoadNotes();
      notes = Array.isArray(data) ? data : [];
      renderNotes();
    }

    async function handleAddNote() {
      const title = noteTitle.value.trim();
      const text = noteInput.value.trim();
      if (!text) return;
      const data = await apiAddNote(title, text);
      if (data && data.success) {
        notes.unshift({ id: data.id, userId: localStorage.getItem("userid"), content: JSON.stringify({ title, text }) });
        noteTitle.value = "";
        noteInput.value = "";
        renderNotes();
      } else {
        statusBox.innerHTML = `<div class="alert alert-danger">Nie udało się dodać notatki</div>`;
      }
    }

    addNoteBtn.addEventListener("click", handleAddNote);

    document.getElementById("logoutLink").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("userid");
    });

    loadNotes();
  </script>
</body>
</html>
